<div class="review-lesson">
<h3>Учебный пример</h3><p>Оцените всю фотографию и предложенные рамки. Подсказка появится после ответа. В зачёт идёт только первый ответ.</p>
<div class="board"><img alt="Фотография с предложенной разметкой"><svg aria-label="Предложенные рамки"></svg></div>
<fieldset><legend>Ваш первый вердикт</legend>
<label><input type="radio" name="review-lesson-status" value="accept"> Разметка верна</label>
<label><input type="radio" name="review-lesson-status" value="reject"> Требует исправления</label>
</fieldset>
<button type="button" data-action="check">Проверить ответ</button>
<p class="lesson-error" role="alert"></p>
<section class="feedback" hidden aria-live="polite"><h4 class="verdict"></h4><p class="expected"></p><p class="hint"></p><p>Первый ответ зафиксирован. Просмотр подсказки не меняет балл.</p><p class="ready" hidden>Ответ сохранён. Ответьте на все восемь примеров и нажмите «Отправить» внизу страницы.</p></section>
</div>
